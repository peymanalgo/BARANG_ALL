name: barang-core

services:
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-barang_minio_dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-barang_minio_dev_only_12345}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - barang_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-barang_core}
      POSTGRES_USER: ${POSTGRES_USER:-barang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-barang_dev_only}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-barang_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-barang_app_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - barang_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-init-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__CoreDatabase: Host=postgres;Port=5432;Database=${POSTGRES_DB:-barang_core};Username=${POSTGRES_APP_USER:-barang_app};Password=${POSTGRES_APP_PASSWORD:-barang_app_dev_only}
      DatabaseAvailability__WaitForAvailability: "true"
      DatabaseAvailability__MaximumAttempts: "15"
      DatabaseAvailability__DelaySeconds: "2"
      CompanyResolution__AllowDevelopmentHeader: "true"
      CompanyResolution__AllowDevelopmentAdministration: "true"
      SecurityBootstrap__Secret: ${SECURITY_BOOTSTRAP_SECRET:-}
      FileStorage__Enabled: "true"
      FileStorage__Endpoint: minio:9000
      FileStorage__AccessKey: ${MINIO_ROOT_USER:-barang_minio_dev}
      FileStorage__SecretKey: ${MINIO_ROOT_PASSWORD:-barang_minio_dev_only_12345}
      FileStorage__Bucket: ${MINIO_BUCKET:-barang-files}
      FileStorage__Secure: "false"
      FileStorage__MaximumUploadBytes: ${MAXIMUM_UPLOAD_BYTES:-26214400}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backoffice:
    build:
      context: ../02_WEB_APP
      dockerfile: src/BARANG.Backoffice/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      CoreApi__BaseUrl: http://api:8080
    ports:
      - "127.0.0.1:${BACKOFFICE_PORT:-5100}:5100"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:5100/login"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  barang_postgres_data:
  barang_minio_data:
