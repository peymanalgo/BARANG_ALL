name: barang-core

services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-barang_core}
      POSTGRES_USER: ${POSTGRES_USER:-barang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-barang_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - barang_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__CoreDatabase: Host=postgres;Port=5432;Database=${POSTGRES_DB:-barang_core};Username=${POSTGRES_USER:-barang};Password=${POSTGRES_PASSWORD:-barang_dev_only}
      DatabaseAvailability__WaitForAvailability: "true"
      DatabaseAvailability__MaximumAttempts: "15"
      DatabaseAvailability__DelaySeconds: "2"
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  barang_postgres_data:
