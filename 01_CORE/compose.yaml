name: barang-core

services:
  redis:
    image: redis:8.2.1-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - barang_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-barang_minio_dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-barang_minio_dev_only_12345}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - barang_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio-cache:
    image: nginx:alpine
    volumes:
      - ./docker/nginx/minio-cache.conf:/etc/nginx/conf.d/default.conf:ro
      - barang_nginx_cache:/var/cache/nginx
    ports:
      - "127.0.0.1:${MINIO_CACHE_PORT:-9002}:9002"
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9002/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-barang_core}
      POSTGRES_USER: ${POSTGRES_USER:-barang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-barang_dev_only}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-barang_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-barang_app_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - barang_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-init-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SOURCE_COMMIT: ${BARANG_BUILD_COMMIT:-unknown}
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__CoreDatabase: Host=postgres;Port=5432;Database=${POSTGRES_DB:-barang_core};Username=${POSTGRES_APP_USER:-barang_app};Password=${POSTGRES_APP_PASSWORD:-barang_app_dev_only}
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      DatabaseAvailability__WaitForAvailability: "true"
      DatabaseAvailability__MaximumAttempts: "15"
      DatabaseAvailability__DelaySeconds: "2"
      CompanyResolution__AllowDevelopmentHeader: "true"
      CompanyResolution__AllowDevelopmentAdministration: "true"
      SecurityBootstrap__Secret: ${SECURITY_BOOTSTRAP_SECRET:-}
      FileStorage__Enabled: "true"
      FileStorage__Endpoint: minio:9000
      FileStorage__AccessKey: ${MINIO_ROOT_USER:-barang_minio_dev}
      FileStorage__SecretKey: ${MINIO_ROOT_PASSWORD:-barang_minio_dev_only_12345}
      FileStorage__Bucket: ${MINIO_BUCKET:-barang-files}
      FileStorage__Secure: "false"
      FileStorage__MaximumUploadBytes: ${MAXIMUM_UPLOAD_BYTES:-9223372036854775807}
      FileStorage__PublicEndpoint: ${MINIO_PUBLIC_ENDPOINT:-localhost:9002}
      FileStorage__PublicBucket: ${MINIO_PUBLIC_BUCKET:-barang-public}
      DataProtection__KeysPath: /app/.keys
    volumes:
      - barang_api_keys:/app/.keys
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backoffice:
    build:
      context: .
      dockerfile: src/BARANG.Backoffice/Dockerfile
      args:
        SOURCE_COMMIT: ${BARANG_BUILD_COMMIT:-unknown}
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      CoreApi__BaseUrl: http://api:8080
      DataProtection__KeysPath: /app/.keys
    volumes:
      - barang_backoffice_keys:/app/.keys
    ports:
      # Backoffice is LAN-reachable; API/data services remain loopback-only.
      - "${BACKOFFICE_PORT:-5100}:5100"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:5100/login"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  barang_postgres_data:
  barang_minio_data:
  barang_redis_data:
  barang_nginx_cache:
  barang_api_keys:
  barang_backoffice_keys:
