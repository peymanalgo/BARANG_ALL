# Edge cache in front of MinIO: presigned GETs are cached per request URI so
# repeated reads of the same immutable object never reach object storage.
# The Host header must pass through untouched - MinIO validates the presigned
# signature against the Host it receives.
proxy_cache_path /var/cache/nginx/minio levels=1:2 keys_zone=minio_cache:50m max_size=10g inactive=30d use_temp_path=off;

server {
    listen 9002;

    location / {
        proxy_pass http://minio:9000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;

        proxy_cache minio_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_key $scheme$request_method$host$request_uri;
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_use_stale updating error timeout;
        proxy_cache_background_update on;

        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_buffering on;
        proxy_buffers 16 64k;

        add_header X-Cache-Status $upstream_cache_status always;
    }
}
