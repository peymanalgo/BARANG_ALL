<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>آفلاین · پیرنگ</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Tahoma, sans-serif;
               background: #f6f7fb; color: #131a2a; text-align: center; }
        .box { padding: 3rem 2rem; }
        .dot { width: 14px; height: 14px; border-radius: 999px; display: inline-block; margin: 0 4px; }
        .d1 { background: #f87171; } .d2 { background: #fbbf24; } .d3 { background: #60a5fa; } .d4 { background: #4ade80; }
        h1 { font-size: 1.4rem; } p { color: #5b6478; }
        a { display: inline-block; margin-top: 1rem; padding: .7rem 1.5rem; background: #2b5cff; color: #fff;
            border-radius: 10px; text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>
    <div class="box">
        <div><span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span><span class="dot d4"></span></div>
        <h1>اتصال اینترنت قطع است</h1>
        <p>وقتی دوباره وصل شدی، دکمه زیر را بزن تا طرح‌ها برگردند.</p>
        <a href="/">تلاش مجدد</a>
    </div>
</body>
</html>
