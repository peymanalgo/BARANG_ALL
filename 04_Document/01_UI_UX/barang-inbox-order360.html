function updateQueue(){const list=filtered(),max=Math.max(1,Math.ceil(list.length/5));pageIndex=Math.min(pageIndex,max);let part=list.slice((pageIndex-1)*5,pageIndex*5);document.querySelector('#queue').innerHTML=`<div class="queue">${part.length?part.map(t=>`<div style="position:relative"><button class="task ${selected===t.id?'selected':''}" onclick="selectTask('${t.id}')" aria-pressed="${selected===t.id}"><div class="task-line"><span class="code">${t.order}</span><span class="badge ${t.priority==='بالا'?'red':''}">${t.priority}</span></div><b>${t.subject}</b><p>${t.customer} · ${fa(t.qty)} عدد</p><div class="task-line"><span class="mini-pill">${t.source}</span><span class="badge ${t.state==='برگشتی'?'orange':t.state==='انجام‌شده'?'green':'blue'}">${t.state}</span></div><div class="task-foot"><span class="due">${t.late?'! ':''}${t.due}</span><small>${t.assignee?'تخصیص‌یافته':'صف مشترک'} ${t.read?'· خوانده‌شده':''}</small></div></button><input type="checkbox" aria-label="انتخاب ${t.order}" ${checked.has(t.id)?'checked':''} onchange="selectBulk('${t.id}',this.checked)" style="position:absolute;left:12px;top:50px;accent-color:var(--primary)"></div>`).join(''):'<div class="empty">اقدامی مطابق فیلترها وجود ندارد.<p>فیلترها را بازنشانی کنید یا نقش دیگری را ببینید.</p></div>'}</div><div class="pagination"><span>${fa(list.length)} اقدام · صفحه ${fa(pageIndex)}/${fa(max)}</span><div class="actions"><button ${pageIndex===1?'disabled':''} onclick="pageIndex--;updateQueue()">‹</button><button ${pageIndex===max?'disabled':''} onclick="pageIndex++;updateQueue()">›</button></div></div>`;if(!list.some(t=>t.id===selected)){selected=list[0]?.id;renderDetail()}}
function selectBulk(id,b){b?checked.add(id):checked.delete(id);document.querySelector('#selectionCount').textContent=fa(checked.size)+' انتخاب'}function bulkRead(){if(!checked.size)return toast('ابتدا اقدام‌ها را انتخاب کنید.');tasks.filter(t=>checked.has(t.id)).forEach(t=>t.read=true);checked.clear();render();toast('اقدام‌های انتخاب‌شده در نمونه خوانده‌شده شدند.')}function selectTask(id){selected=id;detailTab='action';active().read=true;updateQueue();renderDetail();if(window.innerWidth<850)document.querySelector('#detail').scrollIntoView({behavior:'smooth',block:'start'})}
const product=`<svg viewBox="0 0 150 170" width="100%" height="100%" aria-label="تیشرت نمونه"><path d="M48 15L28 24 3 53 23 77 40 64 39 156Q75 165 112 156L111 64 128 77 148 53 122 24 103 15Q76 32 48 15Z" fill="#fafaf7" stroke="#cbbfdb"/><rect x="55" y="66" width="42" height="48" rx="2" fill="#7052e8"/><circle cx="76" cy="85" r="13" fill="#d7eea5"/><text x="76" y="107" text-anchor="middle" fill="white" font-family="Arial" font-size="5">BARANG</text></svg>`;
function renderDetail(){let t=active();if(!t){document.querySelector('#detail').innerHTML='<div class="panel empty">برای مشاهده جزئیات، یک اقدام را انتخاب کنید.</div>';return}document.querySelector('#detail').innerHTML=`<div class="detail-hero"><div class="detail-heading"><div><span class="eyebrow">${t.order} / ${t.id}</span><h2>${t.customer}</h2><p>${t.subject}</p><div class="actions" style="margin-top:12px"><span class="badge blue">${t.role}</span><span class="mini-pill">${t.source}</span><button onclick="toggleFollow()" style="padding:6px 10px;font-size:10px">${t.follow?'★ در پیگیری':'☆ پیگیری'}</button></div></div><div class="product-thumb">${product}</div></div><div class="summary-grid"><div><small>تیراژ سفارش</small><b>${fa(t.qty)} عدد</b></div><div><small>مبلغ سفارش / تومان</small><b>${fa(t.total)}</b></div><div><small>مهلت اقدام</small><b class="${t.late?'danger-text':''}">${t.due}</b></div><div><small>مسئول اقدام</small><b>${t.assignee||'هنوز تخصیص نیافته'}</b></div></div></div><nav class="detail-tabs" aria-label="بخش‌های جزئیات">${[['action','اقدام جاری'],['order','جزئیات سفارش'],['flow','مسیر گردش'],['finance','مالی و انبار'],['files','فایل‌ها'],['chat','گفتگو'],['history','تاریخچه']].map(x=>`<button class="${detailTab===x[0]?'active':''}" aria-pressed="${detailTab===x[0]}" onclick="detailTab='${x[0]}';renderDetail()">${x[1]}${x[0]==='chat'?' '+fa(messages[t.id].length):''}</button>`).join('')}</nav><section class="tab-content" id="tabContent"></section><div class="actionbar"><small>${canAct(t)?'اقدام در محدوده نقش نمایشی شما':t.state==='انجام‌شده'?'این اقدام تکمیل شده است':'در این نقش، این اقدام فقط قابل مشاهده است'}</small><div class="actions"><button ${!canAct(t)?'disabled':''} onclick="actionDialog('refer')">ارجاع ↗</button><button class="return" ${!canAct(t)?'disabled':''} onclick="actionDialog('return')">برگشت برای اصلاح</button><button class="primary" ${!canAct(t)?'disabled':''} onclick="actionDialog('approve')">${t.assignee?'تأیید و ادامه مسیر':'پذیرش اقدام'}</button><button onclick="window.print()" title="چاپ جزئیات">⎙</button></div></div><div class="screen-note">اقدام‌های این نمونه فقط در حافظه صفحه ثبت می‌شوند؛ پس از بازخوانی فایل، وضعیت اولیه برمی‌گردد. وضعیت پرداخت و پیشرفت تولید مستقل هستند.</div>`;renderTab()}
function canAct(t){return t.role===role&&t.state!=='انجام‌شده'}function kv(items){return items.map(x=>`<div class="kv"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}function originalRenderTab(){const t=active();let body='';if(detailTab==='action'){body=`<h2>${t.subject}</h2><p style="font-size:11px">شرح اقدام: اطلاعات سفارش را بررسی کنید، نتیجه را مستند کنید و سپس آن را به مرحله مجاز بعدی بفرستید.</p><div class="work-grid"><div><h3>چک‌لیست نقش جاری</h3>${t.checks.map((c,i)=>`<label class="check"><input type="checkbox" ${c[1]?'checked':''} ${!canAct(t)||!t.assignee?'disabled':''} onchange="active().checks[${i}][1]=this.checked">${c[0]}</label>`).join('')}<div class="blocked">${t.role==='مدیر تولید'?'در نمونه: طرح، مجوز مالی و تخصیص موجودی می‌توانند موازی بررسی شوند؛ شروع چاپ به تکمیل هر سه وابسته است.':t.role==='مدیر مالی'?'بررسی شرایط پرداخت و مجوز مالی بر اساس قرارداد؛ پرداخت کامل الزام عمومی شروع تولید نیست.':'پیش‌نیازها و مجوز خروج باید طبق گردش واقعی کسب‌وکار بررسی شوند.'}</div></div><div><h3>مشخصات اقدام</h3>${kv([['ثبت‌کننده','واحد فروش'],['وضعیت',t.state],['اولویت',t.priority],['صف',t.role],['مهلت',t.due],['شناسه اقدام',t.id]])}${!t.assignee&&canAct(t)?'<div class="note">این کار در صف مشترک است؛ ابتدا آن را بپذیرید تا مسئولیت اقدام به شما تخصیص یابد.</div>':''}</div></div>`}else if(detailTab==='order'){body=`<div class="work-grid"><div><h3>محصول و چاپ</h3>${kv([['محصول',t.product],['جنس','پنبه ۱۰۰٪ · ۱۸۰ گرم'],['رنگ / سایز','سفید / S تا XXL'],['تیراژ',fa(t.qty)+' عدد'],['طرح','نسخه ۲ / چاپ جلو'],['روش چاپ','DTF · ۲۴ × ۳۰ سانتی‌متر'],['بسته‌بندی','پاکت زیپ‌دار و لیبل'],['تحویل برنامه‌ای','۱۴۰۵/۰۷/۱۵']])}</div><div><h3>مشتری و ثبت سفارش</h3>${kv([['نام مشتری',t.customer],['نوع مشتری','حقوقی'],['منبع',t.source],['مسئول ارتباط','مریم رضایی'],['تلفن','۰۲۱–۴۴۰۰۱۲۳۴'],['نشانی','تهران، دفتر مشتری']])}<div class="note" style="margin-top:15px">یادداشت مشتری: سایزها در کارتن‌های جداگانه بسته‌بندی شوند.</div></div></div>`}else if(detailTab==='flow'){body=`<h2>نقشه گردش سفارش</h2><div class="dependency">ثبت سفارش از وب / موبایل / کاربر داخلی ← بررسی تولید ← بررسی موازی طرح، مالی و انبار ← چاپ و پرس ← کنترل کیفیت ← بسته‌بندی ← مجوز خروج و ارسال ← ثبت رسید تحویل<br>در صورت مغایرت کیفیت، بازتولید به چاپ برمی‌گردد. مسیر زیر پیشنهاد است و باید با بیزینس فعلی تطبیق یابد.</div><div class="flow-grid">${['ثبت سفارش',...roles].map((r,i)=>`<div class="flow-node ${r===t.role?'current':i===0?'done':''}"><b>${i===0?'✓ ':r===t.role?'● ':'○ '}${r}</b><small>${r===t.role?'اقدام انتخاب‌شده':i===0?'سفارش ثبت شده':'وضعیت سایر گره‌ها در این نمونه تأیید نشده'}</small></div>`).join('')}</div><div class="dependency">پیش‌نیاز چاپ: نسخه تأییدشده طرح + مجوز مالی طبق قرارداد + حواله انبار. پیش‌نیاز ارسال: تأیید کیفیت + بسته‌بندی + مجوز خروج. این شروط پیشنهادی‌اند.</div>`}else if(detailTab==='finance'){body=`<div class="work-grid"><div><h3>وضعیت مالی / تومان</h3>${kv([['مبلغ کل',fa(t.total)],['دریافت‌شده',fa(t.paid)],['مانده',fa(t.total-t.paid)],['وضعیت',t.paid===t.total?'تسویه‌شده':t.paid?'پرداخت جزئی':'پرداخت‌نشده'],['روش','واریز بانکی']])}<div class="note" style="margin-top:15px">مجوز مالی با وضعیت تسویه یکسان نیست؛ شرایط قراردادی باید جداگانه بررسی شوند.</div></div><div><h3>تأمین و موجودی</h3>${kv([['نیاز سفارش',fa(t.qty)+' عدد'],['قابل تخصیص نمونه',fa(t.qty)+' عدد'],['تعداد کارتن',fa(Math.ceil(t.qty/50))],['حواله مواد','در انتظار تأیید انبار'],['خروج نهایی','وابسته به مجوز خروج']])}</div></div>`}else if(detailTab==='files'){body=`<h2>فایل‌ها و مستندات سفارش</h2>${files[t.id].map((f,i)=>`<div class="attachment"><div><b>▧ ${esc(f.name)}</b><small>${esc(f.type)} · ${esc(f.size)} · فایل نمونه</small></div><button onclick="previewFile(${i})">مشاهده / دانلود</button></div>`).join('')}<label style="margin-top:20px">افزودن پیوست به اقدام<input type="file" ${!canAct(t)?'disabled':''} multiple onchange="attachFiles(this.files)"></label><p style="font-size:10px">فایل انتخابی در همین صفحه نگه داشته می‌شود؛ آپلود به سرور انجام نمی‌شود.</p>`}else if(detailTab==='chat'){body=`<h2>گفتگو و توضیحات اقدام</h2><div class="messages">${messages[t.id].map(m=>`<div class="message internal"><b>${esc(m.author)} · ${esc(m.type)}</b><small>${esc(m.time)}</small>${esc(m.text)}</div>`).join('')}</div><form class="commentbox" onsubmit="event.preventDefault();addComment()"><label>یادداشت داخلی<textarea id="commentText" required placeholder="توضیح، نتیجه بررسی یا درخواست اصلاح…" ${!canAct(t)?'disabled':''}></textarea></label><footer><small>مخاطب: کاربران مجاز سفارش · این پیام به مشتری ارسال نمی‌شود.</small><button class="primary" ${!canAct(t)?'disabled':''}>ثبت یادداشت</button></footer></form>`}else if(detailTab==='history'){body=`<h2>تاریخچه و ردپای اقدام</h2><ul class="audit">${histories[t.id].map(h=>`<li><b>${esc(h.text)}</b><small>${esc(h.by)} · ${esc(h.time)}</small></li>`).join('')}</ul><div class="note">در محصول واقعی، تاریخچه باید از ثبت ممیزی سمت سرور خوانده شود؛ کاربر نباید امکان تغییر یا حذف آن را داشته باشد.</div>`}document.querySelector('#tabContent').innerHTML=body}
function toggleFollow(){active().follow=!active().follow;renderDetail();toast(active().follow?'به پیگیری‌ها اضافه شد.':'از پیگیری‌ها برداشته شد.')}function log(text){histories[active().id].unshift({text,by:role,time:'همین لحظه / نمونه'})}function addComment(){let input=document.querySelector('#commentText');if(!input.value.trim())return;messages[active().id].push({text:input.value.trim(),author:role,type:'یادداشت داخلی',time:'همین لحظه'});log('ثبت یادداشت داخلی');renderDetail();toast('یادداشت نمونه ثبت شد.')}function attachFiles(list){if(!canAct(active()))return;Array.from(list).forEach(f=>{files[active().id].push({name:f.name,type:'پیوست محلی',size:fa(Math.ceil(f.size/1024))+' KB',file:f})});log('انتخاب پیوست محلی');renderTab();toast('پیوست فقط در حافظه صفحه نگه داشته شد.')}function previewFile(i){let f=files[active().id][i];if(f.file){downloadBlob(f.file,f.name);return}if(i===0)showModal('پیش‌نمایش طرح',`<div style="width:180px;height:200px;margin:auto">${product}</div><p>نسخه ۲ · چاپ جلو · تصویر گرافیکی نمونه</p>`);else downloadBlob(new Blob(['\ufeffپیش‌فاکتور نمونه\n'+active().order+'\n'+active().customer+'\nمبلغ: '+fa(active().total)+' تومان'],{type:'text/plain;charset=utf-8'}),'demo-invoice.txt')}
function showModal(title,body){opener=document.activeElement;document.querySelector('#dialogTitle').textContent=title;document.querySelector('#dialogBody').innerHTML=body;document.querySelector('#modal').classList.add('open');document.body.style.overflow='hidden';document.querySelector('#modal .close').focus()}function closeModal(){document.querySelector('#modal').classList.remove('open');document.body.style.overflow='';opener?.focus()}function actionDialog(type){const t=active();if(!canAct(t))return;if(type==='approve'&&!t.assignee){t.assignee=role;t.state='در حال انجام';log('پذیرش اقدام از صف مشترک');render();return toast('اقدام به نقش جاری تخصیص یافت.')}if(type==='approve'&&!t.checks.every(c=>c[1])){detailTab='action';renderDetail();return toast('برای تأیید، همه موارد چک‌لیست اقدام را تکمیل کنید.')}const title=type==='approve'?'تأیید و ادامه مسیر':type==='return'?'برگشت برای اصلاح':'ارجاع اقدام';showModal(title,`<div class="reviewbox">${t.order} · ${t.customer}<br>${t.subject}<br>وضعیت فعلی: ${t.state}</div><form id="actionForm" onsubmit="event.preventDefault();submitAction('${type}')" style="margin-top:18px"><label>مقصد / کارتابل<select id="targetRole" required>${roles.filter(r=>r!==role).map(r=>`<option ${r===nextRole(t.role)?'selected':''}>${r}</option>`).join('')}</select></label><label style="margin-top:15px">${type==='return'?'علت برگشت (الزامی)':'نتیجه بررسی / توضیح (الزامی)'}<textarea id="actionReason" required rows="3" style="width:100%;margin-top:7px"></textarea></label><label class="check"><input type="checkbox" id="actionConfirm" required>نتیجه و مقصد را بررسی کردم.</label><div class="note">این اجرا نمایشی است. مقاصد مجاز، انتقال اتمیک، پیش‌نیازها و کنترل تکرار باید در API واقعی بررسی شوند.</div><div class="form-footer"><button type="button" onclick="closeModal()">انصراف</button><button class="primary">ثبت ${type==='approve'?'تأیید':type==='return'?'برگشت':'ارجاع'} نمونه</button></div></form>`)}function nextRole(r){return roles[Math.min(roles.indexOf(r)+1,roles.length-1)]}function originalSubmitAction(type){const t=active(),target=document.querySelector('#targetRole').value,reason=document.querySelector('#actionReason').value.trim();if(!reason||!document.querySelector('#actionConfirm').checked)return;log((type==='approve'?'تأیید':type==='return'?'برگشت':'ارجاع')+' به '+target+' — '+reason);outgoing.unshift({order:t.order,from:role,to:target,subject:t.subject,reason,status:type==='return'?'برای اصلاح':'در انتظار اقدام',time:'همین لحظه'});if(type==='approve')t.state='انجام‌شده';else {t.role=target;t.assignee='';t.state=type==='return'?'برگشتی':'جدید'}closeModal();render();toast(type==='approve'?'اقدام نمونه تکمیل شد؛ ارجاع بعدی در فهرست ارجاع‌ها ثبت شد.':'اقدام نمونه به کارتابل مقصد منتقل شد.')}
function sent(){return `<section class="panel"><h2>ارجاع‌های ثبت‌شده در نمونه</h2>${outgoing.length?table(['سفارش','از','به','موضوع','وضعیت','زمان'],outgoing.filter(x=>x.from===role).map(x=>[x.order,x.from,x.to,x.subject,x.status,x.time])):'<div class="empty">هنوز ارجاعی ثبت نشده است.<p>از یک اقدام، ارجاع یا تأیید نمونه انجام دهید.</p></div>'}<p style="font-size:11px">در سامانه واقعی، رسید دریافت، اقدام گیرنده و برگشت نیز باید قابل پیگیری باشند.</p></section>`}function board(){return `<section class="panel"><div class="panel-title"><h2>بار صف‌های عملیاتی</h2><span class="badge blue">تمام نقش‌ها / نمایش نمونه</span></div><div class="board">${roles.map(r=>{let list=tasks.filter(t=>t.role===r&&t.state!=='انجام‌شده');return `<div class="lane"><h3>${r} <span class="badge">${fa(list.length)}</span></h3>${list.map(t=>`<div class="job"><b class="code">${t.order}</b><p>${t.customer}<br>${t.subject}</p><span class="badge ${t.late?'red':'blue'}">${t.state}</span><p>${t.due}</p><button onclick="document.querySelector('#roleSelect').value='${r}';changeRole('${r}');setView('inbox');selectTask('${t.id}')">مشاهده اقدام ←</button></div>`).join('')||'<p style="font-size:10px">صف خالی است</p>'}</div>`}).join('')}</div></section>`}function table(head,rows){return `<div class="tablewrap"><table><thead><tr>${head.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>'<tr>'+r.map(x=>`<td>${esc(x)}</td>`).join('')+'</tr>').join('')}</tbody></table></div>`}function downloadBlob(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportTasks(){let list=view==='watch'?tasks:tasks.filter(t=>t.role===role);const quote=s=>'"'+String(s).replace(/"/g,'""')+'"';let lines=[['شناسه اقدام','سفارش','موضوع','نقش','وضعیت','مهلت'],...list.map(t=>[t.id,t.order,t.subject,t.role,t.state,t.due])];downloadBlob(new Blob(['\ufeff'+lines.map(r=>r.map(quote).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),'barang-workflow-demo.csv')}let timer;function toast(s){let e=document.querySelector('#toast');e.textContent=s;e.style.display='block';clearTimeout(timer);timer=setTimeout(()=>e.style.display='none',5000)}document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();toggleNav(false)}if(e.key==='Tab'&&document.querySelector('#modal').classList.contains('open')){let all=[...document.querySelectorAll('#modal button,#modal input,#modal select,#modal textarea')].filter(x=>!x.disabled);if(e.shiftKey&&document.activeElement===all[0]){e.preventDefault();all.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===all.at(-1)){e.preventDefault();all[0].focus()}}});document.querySelector('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
function guide(){const s=JSON.parse(document.querySelector('#codex-workflow-spec').textContent);return `<section class="panel docs"><h2>مرجع کارتابل برای کدکس</h2><div class="note">این فایل پیشنهاد کامل طراحی کارتابل است. قابلیت جدید را بدون درخواست مستقل به سامانه اضافه نکنید؛ امکانات و آیکن‌های مبتنی بر بیزینس موجود باید کامل حفظ شوند.</div><h3>دستور اجرا</h3><pre>این فایل را کامل بخوان، به‌ویژه codex-workflow-spec. ابتدا کارتابل، گردش سفارش، نقش‌ها، API، وضعیت‌ها و مجوزهای سیستم فعلی را بررسی کن. فقط طراحی UI قابلیت‌های موجود را مطابق این مرجع اصلاح کن. هیچ امکان، آیکن عملیاتی، اکشن، منو، فیلد، مرحله، وضعیت یا قانون بیزینس را کم‌وزیاد نکن. هر بخش پیشنهادی که در سامانه وجود ندارد، فقط به عنوان پیشنهاد در گزارش ثبت کن. ترتیب گردش واقعی و پیش‌نیازها مرجع قطعی‌اند؛ داده و handler نمایشی را وارد محصول نکن. FA/EN/AR، RTL/LTR، تقویم سیستم، موبایل، دسترس‌پذیری، محدوده شرکت و RBAC را رعایت کن. قبل و بعد، امکانات را مقایسه و تست کن. سرویس‌های لازم را استارت و health-check کن و روشن نگه دار.</pre><h3>اجزای طراحی</h3><p>${s.components.join(' · ')}</p><h3>امکاناتی که در طراحی در نظر گرفته شده‌اند</h3><ul>${s.features.map(x=>`<li>${x}</li>`).join('')}</ul><h3>قواعد گردش و اتصال به محصول</h3><ol>${s.rules.map(x=>`<li>${x}</li>`).join('')}</ol><h3>رفتارهای نمونه و محدودیت‌ها</h3><ul>${s.demoLimitations.map(x=>`<li>${x}</li>`).join('')}</ul><h3>کنترل پذیرش</h3><ul>${s.acceptance.map(x=>`<li>${x}</li>`).join('')}</ul></section>`}document.querySelector('#roleSelect').innerHTML=roles.map(r=>`<option>${r}</option>`).join('');

// V3 overrides: the queue is a mail list; the order is read as a message.
let reading=false;
function mailTitle(){return {inbox:'ورودی',sent:'ارسال‌شده‌ها',watch:'نشان‌شده‌ها',done:'انجام‌شده‌ها',board:'پیگیری گردش',guide:'راهنمای پیاده‌سازی'}[view]}
function mailRenderImpl(){navActive();let own=tasks.filter(t=>t.role===role&&t.state!=='انجام‌شده');document.querySelector('#inboxCount').textContent=own.length?fa(own.length):'';let html=`<div class="mail-context"><h1>${mailTitle()}</h1><span class="top-note">شرکت برنگ · داده نمایشی · ${role}</span></div>`;if(view==='guide')html+=guide();else if(view==='board')html+=board();else if(view==='sent')html+=sent();else html+=`<div class="mail-layout ${reading?'reading':''}" id="mailLayout"><section class="mail-list"><div class="mail-search"><input id="search" value="${esc(query)}" aria-label="جستجوی پیام‌ها" placeholder="جستجو در کارتابل…" oninput="query=this.value;pageIndex=1;updateQueue()"></div><div class="mail-controls"><select aria-label="فیلتر پیام‌ها" onchange="scope=this.value;pageIndex=1;render()">${[['all','همه پیام‌ها'],['pool','صف مشترک'],['late','نیازمند توجه'],['mine','تخصیص‌یافته']].map(x=>`<option value="${x[0]}" ${scope===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select><div><button onclick="query='';scope='all';priority='all';source='all';render()" title="بازنشانی">↻</button><button onclick="mailFilters()" title="فیلترهای بیشتر">فیلتر</button></div></div>${checked.size?`<div class="mail-bulk"><span>${fa(checked.size)} انتخاب</span><button onclick="bulkRead()">خوانده‌شده</button><button onclick="checked.clear();render()">×</button></div>`:''}<div class="mail-queue" id="queue"></div></section><section class="mail-reader" id="detail"></section></div>`;document.querySelector('#app').innerHTML=html;if(['inbox','watch','done'].includes(view)){updateQueue();renderDetail()}}
function updateQueue(){let list=filtered(),max=Math.max(1,Math.ceil(list.length/8));pageIndex=Math.min(pageIndex,max);if(!list.some(t=>t.id===selected))selected=list[0]?.id;document.querySelector('#queue').innerHTML=list.length?list.slice((pageIndex-1)*8,pageIndex*8).map(t=>`<div class="mail-row ${selected===t.id?'selected':''} ${t.read?'':'unread'}"><input type="checkbox" aria-label="انتخاب ${t.order}" ${checked.has(t.id)?'checked':''} onchange="mailSelect('${t.id}',this.checked)"><button class="mail-row-main" onclick="selectTask('${t.id}')"><div class="mail-row-top"><span class="sender">${t.customer}</span><small>${t.late?'امروز':'فردا'}</small></div><span class="subject">${t.subject}</span><div class="preview">${t.order} · ${fa(t.qty)} تیشرت · ${t.source}</div><div class="mail-row-foot"><span class="mail-status ${t.state==='برگشتی'||t.late?'warn':''}">${t.state}${t.late?' · مهلت نزدیک':''}</span><span>${t.assignee?'':'صف مشترک'}</span></div></button><button class="mail-star ${t.follow?'on':''}" aria-label="نشان‌گذاری سفارش" onclick="mailStar('${t.id}')">${t.follow?'★':'☆'}</button></div>`).join('')+`<div class="mail-page"><span>${fa(list.length)} پیام</span><div><button ${pageIndex===1?'disabled':''} onclick="pageIndex--;updateQueue()">‹</button> ${fa(pageIndex)} / ${fa(max)} <button ${pageIndex===max?'disabled':''} onclick="pageIndex++;updateQueue()">›</button></div></div>`:'<div class="empty">پیامی یافت نشد.<p>فیلترها را تغییر دهید.</p></div>';renderDetail()}
function mailSelect(id,b){b?checked.add(id):checked.delete(id);render()}function mailStar(id){let t=tasks.find(t=>t.id===id);t.follow=!t.follow;render()}function selectTask(id){selected=id;detailTab='action';active().read=true;reading=true;render()}
function backToList(){reading=false;render()}function setView(v){view=v;pageIndex=1;reading=false;render();toggleNav(false)}
function renderDetail(){let t=active();if(!t){document.querySelector('#detail').innerHTML='<div class="reader-empty"><div class="symbol">▱</div>پیامی برای نمایش وجود ندارد.</div>';return}document.querySelector('#detail').innerHTML=`<div class="reader-tools"><div class="actions"><button class="mail-back" onclick="backToList()" aria-label="بازگشت به فهرست">→</button><button onclick="actionDialog('refer')" ${!canAct(t)?'disabled':''}>ارجاع ↗</button><button onclick="actionDialog('return')" ${!canAct(t)?'disabled':''}>برگشت</button><button onclick="window.print()" title="چاپ سفارش">⎙</button></div><button class="primary" onclick="mailApprove()" ${!canAct(t)?'disabled':''}>${!t.assignee?'پذیرش کار':'تأیید و ادامه'}</button></div><div class="reader-inner"><div class="reader-title"><h2>${t.subject}</h2><div class="reader-tags"><span>${t.order}</span><span>${t.role}</span><span>${t.source}</span>${t.priority==='بالا'?'<span style="color:#bb9270">اولویت بالا</span>':''}</div></div><div class="message-heading"><div class="message-avatar">ف</div><div><b>واحد فروش <span style="font-weight:normal;color:#ada5b8">· ${t.customer}</span></b><small>به: ${t.role} · ${t.assignee||'صف مشترک'}</small></div><time>امروز، ۰۹:۴۵</time></div><nav class="mail-tabs" aria-label="جزئیات پیام">${[['action','پیام'],['order','سفارش'],['finance','مالی و انبار'],['files','پیوست‌ها'],['flow','گردش'],['history','تاریخچه']].map(x=>`<button class="${detailTab===x[0]?'active':''}" onclick="detailTab='${x[0]}';renderDetail()">${x[1]}</button>`).join('')}</nav><div id="tabContent"></div><div class="screen-note">اطلاعات و عملیات نمایشی هستند؛ تغییری در سفارش واقعی ایجاد نمی‌شود.</div></div>`;renderTab()}
const legacyTab=originalRenderTab;
function renderTab(){let t=active();if(detailTab!=='action'){legacyTab();return}let first=messages[t.id][0];document.querySelector('#tabContent').innerHTML=`<p class="mail-message">سلام،<br>سفارش <b>${esc(t.customer)}</b> برای <b>${esc(t.subject)}</b> به کارتابل شما ارسال شده است.<br>${esc(first.text)}<br>لطفاً تا <b>${t.due}</b> نتیجه را ثبت کنید.</p><div class="order-strip"><div><small>محصول</small><b>${t.product}</b></div><div><small>تعداد</small><b>${fa(t.qty)} عدد</b></div><div><small>مبلغ / تومان</small><b>${fa(t.total)}</b></div></div><div class="mail-attachments">${files[t.id].slice(0,2).map((f,i)=>`<button onclick="previewFile(${i})"><span>▧</span>${esc(f.name)}</button>`).join('')}</div><details class="mail-checklist" id="checklist"><summary>چک‌لیست اقدام · ${fa(t.checks.filter(c=>c[1]).length)} از ${fa(t.checks.length)} بررسی شده</summary><div class="checklist-body">${t.checks.map((c,i)=>`<label class="check"><input type="checkbox" ${c[1]?'checked':''} ${!canAct(t)||!t.assignee?'disabled':''} onchange="active().checks[${i}][1]=this.checked">${c[0]}</label>`).join('')}${!t.assignee?'<p style="font-size:10px">برای انجام بررسی‌ها، ابتدا کار را بپذیرید.</p>':''}</div></details>${messages[t.id].slice(1).map(m=>`<details class="conversation-line"><summary>${esc(m.author)} · ${esc(m.time)} · یادداشت داخلی</summary><p>${esc(m.text)}</p></details>`).join('')}${canAct(t)?`<form class="mail-reply" onsubmit="event.preventDefault();mailComment()"><textarea id="commentText" aria-label="یادداشت داخلی" required placeholder="یادداشت یا نتیجه بررسی را بنویسید…"></textarea><footer><small>یادداشت داخلی · برای مشتری ارسال نمی‌شود</small><button class="primary">ثبت یادداشت</button></footer></form>`:'<div class="read-only">این پیام در نقش فعلی فقط قابل مشاهده است.</div>'}`}
function mailComment(){addComment()}
function mailApprove(){let t=active();if(t.assignee&&!t.checks.every(c=>c[1])){detailTab='action';renderDetail();let c=document.querySelector('#checklist');c.open=true;c.scrollIntoView({behavior:'smooth',block:'center'});toast('چک‌لیست را تکمیل کنید و دوباره تأیید را بزنید.');return}actionDialog('approve')}
function mailFilters(){showModal('فیلتر پیام‌ها',`<form onsubmit="event.preventDefault();priority=document.querySelector('#mailPriority').value;source=document.querySelector('#mailSource').value;pageIndex=1;closeModal();render()"><label>اولویت<select id="mailPriority">${['all','بالا','عادی'].map(x=>`<option value="${x}" ${x===priority?'selected':''}>${x==='all'?'همه':x}</option>`).join('')}</select></label><label style="margin-top:15px">منبع سفارش<select id="mailSource">${['all','وب اپلیکیشن','موبایل اپلیکیشن','کاربر داخلی'].map(x=>`<option value="${x}" ${x===source?'selected':''}>${x==='all'?'همه':x}</option>`).join('')}</select></label><div class="form-footer"><button type="button" onclick="closeModal()">انصراف</button><button class="primary">اعمال فیلتر</button></div></form>`)}

function svg(k){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${glyphs[k]||glyphs.info}"/></svg>`}

const mailRender=mailRenderImpl;
function render(){mailRender();if(!['inbox','watch','done'].includes(view))return;let t=active(),can=!!t&&canAct(t);let bar=`<div class="minimal-toolbar" role="toolbar" aria-label="ابزارهای سفارش انتخاب‌شده">${tool('back','بازگشت به فهرست','backToList()',false,'mobile-back')}<div class="tool-group">${tool('approve',t&&!t.assignee?'پذیرش کار':'تأیید و ادامه','minimalApprove()',!can,'approve')}${tool('refer','ارجاع به کارتابل دیگر',"actionDialog('refer')",!can)}${tool('return','برگشت برای اصلاح',"actionDialog('return')",!can,'return-action')}</div><span class="tool-divider"></span><div class="tool-group">${tool('info','جزئیات سفارش',"openFeature('order')",!t)}${tool('clip','پیوست‌ها',"openFeature('files')",!t)}${tool('chat','یادداشت‌های داخلی',"openFeature('chat')",!t)}${tool('more','ابزارهای بیشتر','moreTools()',!t)}</div><span class="toolbar-context">${t?`سفارش انتخاب‌شده <strong>${t.order}</strong>`:'پیامی انتخاب نشده'}</span></div>`;document.querySelector('#mailLayout').insertAdjacentHTML('beforebegin',bar)}
function renderDetail(){let t=active();if(!t){document.querySelector('#detail').innerHTML='<div class="reader-empty"><div class="symbol">▱</div>پیامی برای نمایش وجود ندارد.</div>';return}document.querySelector('#detail').innerHTML=`<div class="reader-inner"><div class="simple-header"><div><h2>${t.subject}</h2><small>${t.order} · ${t.customer}</small></div><time>امروز، ۰۹:۴۵</time></div><div class="simple-sender"><span class="sender-dot">ف</span><span>واحد فروش &nbsp; ← &nbsp; ${t.role}</span></div><div class="simple-message">سلام،<br>لطفاً سفارش <strong>${t.customer}</strong> را بررسی کنید.<br>این سفارش شامل <strong>${fa(t.qty)} عدد ${t.product}</strong> است.<br>نتیجه بررسی را تا <strong>${t.due}</strong> ثبت کنید.<br><br>${esc(messages[t.id][0].text)}<br><br>با تشکر<br>واحد فروش</div><div class="simple-bottom"><span>${svg('clip')}${fa(files[t.id].length)} پیوست</span><span>${svg('chat')}${fa(messages[t.id].length-1)} یادداشت</span><span>${svg('clock')}${t.state}</span></div>${t.state==='برگشتی'?'<div class="simple-note">این اقدام برای اصلاح برگشته است؛ علت و مسیر را از آیکن تاریخچه در «ابزارهای بیشتر» ببینید.</div>':''}${!canAct(t)?'<div class="simple-note">این پیام فقط قابل مشاهده است.</div>':''}</div>`}
function openFeature(tab){if(!active())return;detailTab=tab;showModal({order:'جزئیات سفارش',files:'پیوست‌ها',chat:'یادداشت‌های داخلی',flow:'مسیر گردش',finance:'مالی و انبار',history:'تاریخچه',action:'چک‌لیست اقدام'}[tab],'<div id="tabContent"></div>');document.querySelector('#modal').classList.add('modal-wide');originalRenderTab()}
function moreTools(){showModal('ابزارهای سفارش',`<div class="feature-grid">${[['checklist','چک‌لیست',"openFeature('action')"],['finance','مالی و انبار',"openFeature('finance')"],['flow','گردش سفارش',"openFeature('flow')"],['clock','تاریخچه',"openFeature('history')"],['print','چاپ',"window.print()"],['export','خروجی فهرست','exportTasks()']].map(x=>`<button onclick="${x[2]}">${svg(x[0])}<span>${x[1]}</span></button>`).join('')}</div>`)}
function minimalApprove(){let t=active();if(t.assignee&&!t.checks.every(c=>c[1])){openFeature('action');toast('پیش از تأیید، چک‌لیست را تکمیل کنید.');return}actionDialog('approve')}
function addComment(){let input=document.querySelector('#commentText');if(!input.value.trim())return;messages[active().id].push({text:input.value.trim(),author:role,type:'یادداشت داخلی',time:'همین لحظه'});log('ثبت یادداشت داخلی');renderDetail();openFeature('chat');toast('یادداشت نمونه ثبت شد.')}
function renderTab(){originalRenderTab()}

// V5: shared receive/sent viewer. Click first, then order360 + historical path + permitted actions.
const stepNames=['محصول','طرح','چاپ','بسته‌بندی','قیمت','پرداخت','تحویل'];const stepGlyphs=['info','clip','print','checklist','finance','approve','refer'];
const baseIds=tasks.map(t=>t.id);roles.forEach((r,i)=>{const base=tasks.find(t=>t.role===r);if(!base)return;const target=roles[(i+1)%roles.length],id='S-'+i;let copy={...base,id,role:target,assignee:'کاربر '+target,state:'در انتظار مقصد',sentBy:r,sentTo:target,checks:base.checks.map(c=>[c[0],c[1]])};tasks.push(copy);messages[id]=messages[base.id].map(m=>({...m}));files[id]=files[base.id].map(f=>({...f}));histories[id]=[{text:'ارجاع به '+target,by:r,time:'امروز · ۱۰:۲۰'},...histories[base.id].map(x=>({...x}))]});
const oldSubmit=originalSubmitAction;function submitAction(type){const id=active().id,from=role,target=document.querySelector('#targetRole').value;oldSubmit(type);let t=tasks.find(t=>t.id===id);t.sentBy=from;t.sentTo=target;if(outgoing[0])outgoing[0].taskId=id;render()}
function filtered(){return tasks.filter(t=>(view==='sent'?t.sentBy===role:t.role===role&&t.state!=='انجام‌شده'&&t.sentBy!==role)&&(scope==='all'||scope==='mine'&&!!t.assignee||scope==='pool'&&!t.assignee||scope==='late'&&t.late)&&(priority==='all'||t.priority===priority)&&(source==='all'||t.source===source)&&(t.order+' '+t.customer+' '+t.subject).includes(query))}
function canAct(t){return t.role===role&&t.state!=='انجام‌شده'&&view==='inbox'}
function setView(v){view=v==='sent'?'sent':'inbox';selected=undefined;reading=false;pageIndex=1;checked.clear();render();toggleNav(false)}
function changeRole(r){role=r;selected=undefined;reading=false;pageIndex=1;scope='all';query='';priority='all';source='all';checked.clear();document.querySelector('#userName').textContent=r;render()}
function render(){navActive();document.querySelector('#inboxCount').textContent=fa(tasks.filter(t=>t.role===role&&t.state!=='انجام‌شده'&&t.sentBy!==role).length);document.querySelector('#app').innerHTML=`<div class="folder-heading"><h1>${view==='sent'?'ارسال‌شده‌ها':'صندوق دریافت'}</h1><small>شرکت برنگ · داده نمایشی</small></div><div class="inbox360-layout ${reading?'reading':''}" id="mailLayout"><section class="mail-list"><div class="mail-search"><input id="search" value="${esc(query)}" aria-label="جستجوی پیام" placeholder="جستجو در پیام‌ها…" oninput="query=this.value;pageIndex=1;updateQueue()"></div><div class="mail-controls"><select aria-label="فیلتر پیام" onchange="scope=this.value;render()">${[['all','همه پیام‌ها'],['pool','صف مشترک'],['late','نیازمند توجه']].map(x=>`<option value="${x[0]}" ${scope===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select><div><button onclick="query='';scope='all';priority='all';source='all';render()" title="بازنشانی">↻</button><button onclick="mailFilters()" title="فیلتر">${svg('filter')}</button></div></div><div class="mail-queue" id="queue"></div></section><section class="mail-reader" id="detail"></section></div>`;updateQueue()}
function updateQueue(){let list=filtered(),max=Math.max(1,Math.ceil(list.length/8));pageIndex=Math.min(pageIndex,max);if(selected&&!list.some(t=>t.id===selected))selected=undefined;document.querySelector('#queue').innerHTML=list.length?list.slice((pageIndex-1)*8,pageIndex*8).map(t=>`<div class="mail-row ${selected===t.id?'selected':''} ${t.read?'':'unread'}"><button class="mail-row-main" onclick="selectTask('${t.id}')"><div class="mail-row-top"><span class="sender">${t.customer}</span><small>امروز</small></div><span class="subject">${t.subject}</span>${view==='sent'?`<div class="mail-status-sent">به: ${t.sentTo||t.role}</div>`:''}</button><button class="mail-star ${t.follow?'on':''}" aria-label="نشان‌گذاری" onclick="mailStar('${t.id}')">${t.follow?'★':'☆'}</button></div>`).join('')+`<div class="mail-page"><span>${fa(list.length)} پیام</span><div><button ${pageIndex===1?'disabled':''} onclick="pageIndex--;updateQueue()">‹</button>${fa(pageIndex)} / ${fa(max)}<button ${pageIndex===max?'disabled':''} onclick="pageIndex++;updateQueue()">›</button></div></div>`:'<div class="empty">پیامی وجود ندارد.</div>';renderDetail()}
function selectTask(id){selected=id;active().read=true;reading=true;render()}
function pathEntries(t){const base=[{text:'ثبت سفارش',by:t.source,time:'دیروز · ۱۶:۲۰'},{text:'بررسی اولیه سفارش',by:'واحد فروش',time:'امروز · ۰۹:۱۵'}];let index=roles.indexOf(t.role);if(index>0)base.push({text:'بررسی و ارجاع سفارش',by:'مدیر تولید',time:'امروز · ۰۹:۳۰'});return [...base,...histories[t.id].slice().reverse().filter(x=>!x.text.startsWith('ثبت سفارش')), {text:view==='sent'?'در انتظار اقدام مقصد':t.state==='انجام‌شده'?'اقدام تکمیل شده':t.subject,by:t.role,time:view==='sent'?'مقصد: '+(t.sentTo||t.role):'اقدام جاری · '+t.due,current:true}]}
function renderDetail(){const t=active();if(!t){document.querySelector('#detail').innerHTML='<div class="reader-empty"><div class="empty-symbol">▱</div>یک پیام را انتخاب کنید.<p style="font-size:10px">نمای ۳۶۰ درجه سفارش، مسیر طی‌شده و عملیات آن اینجا باز می‌شود.</p></div>';return}let can=canAct(t);document.querySelector('#detail').innerHTML=`<div class="order-workspace"><button class="mail-back" onclick="backToList()">→ بازگشت به پیام‌ها</button><header class="order-topline"><div><h2>${t.customer}</h2><small>${t.order} · ${t.subject}</small></div><span class="tiny-state">${view==='sent'?'ارسال‌شده':t.state}</span></header><div class="order-split"><section class="order-overview"><div class="overview-label">نمای ۳۶۰ درجه سفارش <small>برای جزئیات، بخش را انتخاب کنید</small></div><div class="order-ring">${stepNames.map((s,i)=>{let a=(-90+i*360/7)*Math.PI/180;return `<button class="ring-stage" style="left:${185+139*Math.cos(a)-42}px;top:${180+137*Math.sin(a)-34}px" onclick="openStage(${i})" aria-label="جزئیات ${s}">${svg(stepGlyphs[i])}${s}</button>`}).join('')}<div class="ring-product">${product}<small>پیش‌نمایش محصول</small></div></div><div class="overview-summary"><div><small>تعداد</small><b>${fa(t.qty)} عدد</b></div><div><small>مبلغ / تومان</small><b>${fa(t.total)}</b></div><div><small>منبع سفارش</small><b>${t.source}</b></div></div></section><section class="workflow-panel"><h3 class="cycle-title">مسیر طی‌شده سفارش</h3><ol class="travelled">${pathEntries(t).map(e=>`<li class="${e.current?'current':''}">${esc(e.text)}<small>${esc(e.by)} · ${esc(e.time)}</small></li>`).join('')}</ol><div class="workflow-actions"><h3>عملیات در دسترس شما</h3><button class="primary" ${!can?'disabled':''} onclick="minimalApprove()">${t.assignee?'✓ تأیید و ادامه':'✓ پذیرش کار'}</button><div class="workflow-secondary"><button ${!can?'disabled':''} onclick="actionDialog('refer')">↗ ارجاع</button><button ${!can?'disabled':''} onclick="actionDialog('return')">↶ برگشت</button></div><div class="compact-tools">${tool('clip','پیوست‌ها',"openFeature('files')")}${tool('chat','یادداشت‌ها',"openFeature('chat')")}${tool('checklist','چک‌لیست',"openFeature('action')")}${tool('clock','تاریخچه کامل',"openFeature('history')")}${tool('print','چاپ','window.print()')}</div><div class="workflow-hint">${can?'عملیات فقط برای اقدام جاری در نقش مجاز فعال است.':'این پیام در نقش فعلی فقط قابل مشاهده است؛ عملیات انتقال غیرفعال‌اند.'}</div></div></section></div><div class="message-caption">${esc(messages[t.id][0].text)}</div><div class="order-note">تمام داده‌ها و زمان‌ها نمونه‌اند؛ مسیر فقط رویدادهای طی‌شده و اقدام جاری را نشان می‌دهد.</div></div>`}
function openStage(i){const t=active();const contents=[[['محصول',t.product],['جنس','پنبه ۱۰۰٪'],['رنگ','سفید'],['سایزها','S تا XXL'],['تیراژ',fa(t.qty)]],[['نام طرح','نسخه نهایی ۲'],['محل','جلو / مرکز سینه'],['ابعاد','۲۴ × ۳۰ سانتی‌متر'],['فایل','طرح برداری نمونه']],[['روش','DTF'],['خط','خط چاپ ۲'],['تیراژ',fa(t.qty)],['پیشرفت نمونه',fa(t.progress)+'٪']],[['بسته','پاکت زیپ‌دار'],['لیبل','اختصاصی'],['کارتن',fa(Math.ceil(t.qty/50))+' کارتن']],[['مبلغ کل / تومان',fa(t.total)],['قیمت واحد / تومان',fa(t.total/t.qty)]],[['دریافت‌شده / تومان',fa(t.paid)],['مانده / تومان',fa(t.total-t.paid)],['وضعیت',t.paid===t.total?'تسویه':'پرداخت جزئی / پرداخت‌نشده']],[['موعد نمونه','۱۴۰۵/۰۷/۱۵'],['مقصد','تهران، دفتر مشتری'],['گیرنده','مسئول تدارکات'],['روش','ارسال اختصاصی']]];showModal('سفارش '+t.order+' · '+stepNames[i],`<div class="stage-fields">${kv(contents[i])}</div><p style="font-size:10px">اطلاعات مربوط به سفارش انتخاب‌شده است؛ مشخصات فنی نمونه‌اند.</p>`)}
selected=undefined;view='inbox';reading=false;render();
</script></body></html>
