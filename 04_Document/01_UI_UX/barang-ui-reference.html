>جزئیات ←</button></div></div>`).join('')}</div></div>`}else if(page==='reports'){html=header(t('reports'),'خلاصه مدیریتی از سفارش، تولید و دریافت‌ها.',false)+kpis([['مبلغ سفارش‌های نمونه',money(orders.reduce((a,o)=>a+o.total,0)),'تومان'],['دریافت‌شده',money(orders.reduce((a,o)=>a+o.paid,0)),'تومان'],['تیراژ ثبت‌شده',money(orders.reduce((a,o)=>a+o.qty,0)),'عدد'],['تحویل‌شده',money(1),'سفارش']])+`<div class="split"><div class="panel"><h2>تیراژ سفارش‌های نمونه</h2><div class="chart">${orders.slice(0,6).map(o=>`<div class="barcol"><span>${money(o.qty)}</span><i style="height:${o.qty/2500*125}px"></i><span>${o.customer.replace('شرکت ','').replace('گروه ','')}</span></div>`).join('')}</div></div><div class="panel"><h2>مانده دریافت مشتریان</h2>${simpleTable(['مشتری','مانده / تومان'],orders.filter(o=>o.total>o.paid).map(o=>[o.customer,money(o.total-o.paid)]))}</div></div>`}else if(page==='guide'){html=guide()}else html=moduleScreen(page);document.querySelector('#content').innerHTML=html+demoNote;if(page==='orders')renderOrderTable()}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function filterStatus(s){statusFilter=s;pageNum=1;render()}function renderOrderTable(){let list=orders.filter(o=>(statusFilter==='all'||o.status===statusFilter)&&(o.id+' '+o.customer+' '+o.product).toLowerCase().includes(query.toLowerCase()));if(activeSort)list.sort((a,b)=>b.total-a.total);let max=Math.max(1,Math.ceil(list.length/5));pageNum=Math.min(pageNum,max);let rows=list.slice((pageNum-1)*5,pageNum*5);document.querySelector('#orderTable').innerHTML=`<div class="tablewrap"><table><thead><tr><th>سفارش / محصول</th><th>مشتری</th><th>تیراژ</th><th><button onclick="activeSort=!activeSort;renderOrderTable()" style="padding:0;border:0;background:none;font-size:10px">مبلغ / تومان ⇅</button></th><th>وضعیت / پیشرفت</th><th>موعد تحویل</th><th>منبع</th><th>عملیات</th></tr></thead><tbody>${rows.length?rows.map(o=>`<tr><td><b class="code">${o.id}</b><small>${o.product}</small></td><td><b>${o.customer}</b><small>مشتری حقوقی</small></td><td>${money(o.qty)}</td><td>${money(o.total)}</td><td><span class="badge ${o.tone}">${o.status}</span><div class="progressbar"><span style="width:${o.progress}%"></span></div></td><td>${o.date}</td><td>${o.source}</td><td><div class="row-actions">${o.id==='ORD-10428'?`<button class="orbit-button" onclick="open360()" title="نمای ۳۶۰ درجه سفارش آریا">${icon('designs')}360°</button>`:`<button onclick="orderDetails('${o.id}')" title="جزئیات سفارش">${icon('orders')}</button>`}<button onclick="editOrder('${o.id}')" title="ویرایش نمونه">✎</button><button onclick="orderDetails('${o.id}')" title="تاریخچه و وضعیت">⋯</button></div></td></tr>`).join(''):'<tr><td colspan="8"><div class="empty">سفارشی یافت نشد. فیلترها را تغییر دهید.</div></td></tr>'}</tbody></table></div><div class="pager"><span>${money(list.length)} نتیجه · صفحه ${money(pageNum)} از ${money(max)}</span><div class="actions"><button ${pageNum===1?'disabled':''} onc function simpleTable(head,rows){return `<div class="tablewrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}function orderDetails(id){let o=orders.find(x=>x.id===id);showDialog('جزئیات '+o.id,`<div class="formgrid"><div><h3>${o.customer}</h3><p>${o.product}</p><span class="badge ${o.tone}">${o.status}</span></div><div><p>تیراژ: ${money(o.qty)} عدد<br>مبلغ: ${money(o.total)} تومان<br>دریافتی: ${money(o.paid)} تومان<br>تحویل: ${o.date}</p></div></div><div class="note">نمای حلقه‌ای کامل در این نمونه برای سفارش آریا فعال است. در سامانه واقعی باید برای تمام سفارش‌ها از داده همان سفارش استفاده شود.</div>`)}function editOrder(id){const o=orders.find(x=>x.id===id);showDialog('ویرایش نمونه '+id,`<form onsubmit="event.preventDefault();toast('تغییر نمایشی ذخیره شد؛ داده واقعی تغییر نکرد.');closeDialog()"><label>یادداشت سفارش<textarea required rows="4" placeholder="یادداشت ${o.customer}"></textarea></label><div class="form-footer"><button type="button" onclick="closeDialog()">انصراف</button><button class="primary">ذخیره نمونه</button></div></form>`)}
const steps=['انتخاب محصول','انتخاب طرح','تنظیمات چاپ','بسته‌بندی','قیمت سفارش','پرداخت','تحویل'];const formFields=[[['customer','مشتری','text','شرکت آریا'],['model','مدل محصول','select','یقه گرد|یقه هفت|پولوشرت'],['fabric','جنس پارچه','select','پنبه ۱۰۰٪|پنبه ترکیبی'],['color','رنگ','select','سفید|مشکی|آبی'],['qty','تعداد','number','2500'],['sizes','ترکیب سایزها','text','S: 250 / M: 750 / L: 1000 / XL: 500']],[['design','نام طرح','text','ARYA / نسخه ۲'],['location','محل چاپ','select','جلو|پشت|جلو و پشت'],['dimensions','ابعاد طرح','text','۲۴ × ۳۰ سانتی‌متر'],['approval','تأیید مشتری','select','در انتظار|تأییدشده']],[['method','روش چاپ','select','DTF|سیلک|سابلیمیشن'],['line','خط تولید','select','خط چاپ ۱|خط چاپ ۲'],['operator','مسئول چاپ','text','رضا کریمی'],['printNote','توضیحات چاپ','text','تست رنگ پیش از شروع تیراژ']],[['pack','نوع بسته','select','پاکت زیپ‌دار|سلفون|جعبه'],['label','لیبل','select','اختصاصی مشتری|بدون لیبل'],['carton','تعداد در کارتن','number','50'],['packNote','توضیحات بسته‌بندی','text','تفکیک سایزها']],[['unit','قیمت واحد / تومان','number','74000'],['discount','تخفیف / تومان','number','0'],['tax','مالیات / تومان','number','0']],[['paid','مبلغ دریافتی / تومان','number','100000000'],['payment','روش پرداخت','select','واریز بانکی|چک|نقدی'],['ref','شماره پیگیری','text','DEMO-1024']],[['due','موعد تحویل / شمسی','text','۱۴۰۵/۰۷/۱۵'],['shipping','روش ارسال','select','باربری|پیک|تحویل حضوری'],['address','نشانی تحویل','text','تهران، دفتر مشتری'],['receiver','نام گیرنده','text','مسئول تدارکات']]];
function wizard(){return header('ثبت سفارش جدید','۷ مرحله مشخص؛ اطلاعات واردشده تا زمانی که این صفحه باز است نگه داشته می‌شود.',false)+`<section class="panel"><div class="wizard"><ol class="steps">${steps.map((s,i)=>`<li><button class="${wizardStep===i?'active':''}" onclick="goStep(${i})"><span class="number">${money(i+1)}</span>${s}</button></li>`).join('')}</ol><div><div class="panel-title"><h2>${steps[wizardStep]}</h2><span class="badge blue">مرحله ${money(wizardStep+1)} از ۷</span></div><form id="wizardForm" onsubmit="event.preventDefault();wizardNext()"><div class="formgrid">${formFields[wizardStep].map(([key,label,type,value])=>`<label>${label}${type==='select'?`<select data-field="${key}" required>${value.split('|').map(v=>`<option ${(draft[key]??value.split('|')[0])===v?'selected':''}>${v}</option>`).join('')}</select>`:`<input data-field="${key}" type="${type}" ${type==='number'?`min="${key==='qty'||key==='carton'?1:0}" step="1"`:''} required value="${escapeHTML(draft[key]??value)}">`}</label>`).join('')}</div>${wizardStep===1?'<label style="margin-top:18px">فایل طرح نمونه<input type="file" accept=".svg,.png,.jpg,.pdf" onchange="toast(this.files.length?\'فایل انتخاب شد؛ آپلود به سرور انجام نمی‌شود.\':\'فایلی انتخاب نشده\')"></label>':''}${wizardStep===4?'<div class="note" style="margin-top:18px">مبلغ نمونه = تعداد × قیمت واحد − تخفیف + مالیات. قواعد واقعی قیمت‌گذاری باید از سامانه فعلی خوانده شوند.</div>':''}<div class="form-footer"><button type="button" ${wizardStep===0?'disabled':''} onclick="saveDraft();wizardStep--;render()">مرحله قبل</button><div class="actions"><button type="button" onclick="saveDraft();toast('پیش‌نویس در حافظه همین صفحه نگه داشته شد.')">نگه‌داشتن پیش‌نویس</button><button class="primary">${wizardStep===6?'مرور و ثبت نمونه':'مرحله بعد ←'}</button></div></div></form></div></div></section>`}function saveDraft(){document.querySelectorAll('[data-field]').forEach(e=>draft[e.dataset.field]=e.value)}function goStep(i){if(i>wizardStep&&!document.querySelector('#wizardForm').reportValidity())return;saveDraft();wizardStep=i;render()}function wizardNext(){saveDraft();if(wizardStep<6){wizardStep++;render()}else{let total=Number(draft.qty||2500)*Number(draft.unit||74000)-Number(draft.discount||0)+Number(draft.tax||0);showDialog('مرور سفارش نمونه',`<p>مشتری: ${escapeHTML(draft.customer)}<br>تعداد: ${money(draft.qty)} عدد<br>طرح: ${escapeHTML(draft.design)}<br>مبلغ: ${money(total)} تومان<br>تحویل: ${escapeHTML(draft.due)}</p><div class="note">این نسخه به API متصل نیست. سفارش واقعی ثبت نمی‌شود.</div><button class="primary" style="margin-top:18px" onclick="closeDialog();toast('مرور سفارش نمونه تکمیل شد.');navigate('orders')">تأیید نمونه</button>`)}}
const modules={customers:{desc:'مشتری حقیقی و حقوقی، مسئول ارتباط و سابقه سفارش.',heads:['مشتری','نوع','مسئول ارتباط','تلفن','سفارش فعال'],rows:[['شرکت آریا','حقوقی','مریم رضایی','021-4400-1234','۱'],['استودیو نارنج','حقوقی','علی موسوی','021-4400-5678','۱'],['گروه سپهر','حقوقی','ندا شریفی','021-4400-9000','۱']]},pricing:{desc:'قیمت پایه محصول، هزینه چاپ و بسته‌بندی؛ قواعد واقعی پروژه حفظ شوند.',heads:['عنوان تعرفه','واحد','مبلغ نمونه / تومان','اعتبار'],rows:[['تیشرت پنبه‌ای سفید','عدد','۵۰٬۰۰۰','فعال'],['چاپ DTF جلو','عدد','۲۰٬۰۰۰','فعال'],['پاکت و لیبل','عدد','۴٬۰۰۰','فعال']]},inventory:{desc:'مواد اولیه و خرید؛ موجودی قابل مصرف برای سفارش‌ها.',heads:['کالا','موجودی','رزروشده','قابل مصرف','وضعیت'],rows:[['تیشرت سفید L','۲٬۸۰۰','۱٬۰۰۰','۱٬۸۰۰','موجود'],['تیشرت سفید M','۱٬۵۰۰','۷۵۰','۷۵۰','موجود'],['پاکت زیپ‌دار','۳٬۰۰۰','۲٬۹۰۰','۱۰۰','نیاز به خرید']]},quality:{desc:'ثبت نتیجه بازرسی و پیگیری موارد بازتولید.',heads:['سفارش','بازرس','تعداد کنترل‌شده','مغایرت','نتیجه'],rows:[['ORD-10423','زهرا حسینی','۶۵۰','۱۲ مورد','نیاز به اصلاح'],['ORD-10427','زهرا حسینی','۴۰۰','۰','تأیید']]},delivery:{desc:'بسته‌بندی، هماهنگی ارسال و رسید تحویل.',heads:['سفارش','مشتری','تعداد کارتن','روش ارسال','وضعیت'],rows:[['ORD-10427','استودیو نارنج','۸','پیک اختصاصی','آماده ارسال'],['ORD-10424','شرکت مهر','۱۶','باربری','تحویل‌شده']]},inbox:{desc:'اقدام‌های ارجاع‌شده، مسئول و مهلت پاسخ.',heads:['موضوع','مرتبط با','مسئول','مهلت','وضعیت'],rows:[['تأیید طرح نسخه ۲','ORD-10426','واحد فروش','امروز','در انتظار'],['بررسی مغایرت چاپ','ORD-10423','سرپرست تولید','امروز','در حال بررسی'],['هماهنگی ارسال','ORD-10427','واحد ارسال','فردا','جدید']]},notifications:{desc:'هشدارهای قابل پیگیری بر اساس رویدادهای سامانه.',heads:['اعلان','سفارش','اولویت','وضعیت'],rows:[['مانده پرداخت پیش از تحویل','ORD-10428','متوسط','خوانده‌نشده'],['طرح نیازمند تأیید مشتری','ORD-10426','بالا','خوانده‌نشده'],['چاپ سفارش نارنج تکمیل شد','ORD-10427','اطلاع','خوانده‌شده']]},master:{desc:'مرجع مشترک محصول، جنس، سایز، رنگ، روش چاپ و بسته‌بندی.',heads:['گروه داده','نمونه مقدار','وضعیت'],rows:[['محصول','تیشرت یقه گرد','فعال'],['جنس','پنبه ۱۰۰٪','فعال'],['سایز','S / M / L / XL / XXL','فعال'],['روش چاپ','DTF / سیلک / سابلیمیشن','فعال'],['بسته‌بندی','پاکت زیپ‌دار','فعال']]},admin:{desc:'شرکت‌ها، کاربران، نقش‌ها و دسترسی‌ها در ساختار موجود.',heads:['حوزه','نمونه','وضعیت'],rows:[['شرکت','برنگ رستاک نیک گستر','فعال'],['کاربر','پیمان خوشه‌چین','مدیر سیستم'],['نقش','فروش / تولید / کیفیت / مالی','قابل پیکربندی'],['دسترسی','در محدوده شرکت مجاز','کنترل‌شده']]}};
function moduleScreen(k){let m=modules[k];return header(t(k),m.desc,false)+`<section class="panel"><div class="panel-title"><h2>${t(k)}</h2><button class="secondary" onclick="showModuleForm('${k}')">مشاهده الگوی فرم ＋</button></div>${simpleTable(m.heads,m.rows)}</section>`}
function previewDesign(a){showDialog('جزئیات طرح '+a,shirt('#fff',a)+'<p>نسخه ۲ · فایل برداری · محل چاپ: جلو</p>')}function showModuleForm(k){showDialog('الگوی فرم '+t(k),'<p>این نما مرجع ظاهر فهرست و فرم‌های این ماژول است. کدکس باید عملیات واقعی موجود را به این الگو متصل کند.</p><label>عنوان نمونه<input placeholder="عنوان"></label><div class="note" style="margin-top:16px">هیچ داده واقعی ذخیره نمی‌شود.</div>')}
function guide(){return header('راهنمای انتقال طراحی به کدکس','مرجع قابل خواندن انسان و ماشین؛ دستور اجرایی، توکن‌ها، مسیرها و معیار پذیرش.',false)+`<section class="panel docs"><h2>چطور از این فایل استفاده شود؟</h2><p>این فایل را داخل پروژه قرار دهید و از کدکس بخواهید HTML، CSS، JavaScript و بلوک JSON با شناسه <code>codex-ui-spec</code> را کامل بخواند. طراحی یک مرجع UI است و ساختار واقعی پروژه باید مبنای اتصال باشد.</p><div class="note">تنها تصویر صفحه سفارش بررسی شده است. جزئیات سایر صفحات پیشنهاد طراحی‌اند و نشان‌دهنده بررسی کد یا API سامانه نیستند.</div><h3>دستور آماده برای کدکس</h3><pre id="promptText">این فایل HTML را به عنوان مرجع بازطراحی UI سیستم فعلی برنگ کامل بخوان، به‌ویژه بلوک codex-ui-spec. ابتدا AGENTS.md، ساختار پروژه، مسیرهای موجود، کامپوننت‌ها، APIها، RBAC، محدوده شرکت و موتور زبان/تاریخ را بررسی کن. سپس پوسته، رنگ‌ها، فاصله‌ها، منو، داشبورد، گریدها، فیلترها، فرم سفارش هفت‌مرحله‌ای و نمای ۳۶۰ درجه را مطابق مرجع در کامپوننت‌های قابل استفاده مجدد اجرا کن. تمام قابلیت‌ها، عملیات، قوانین کسب‌وکار، داده‌ها، API و دسترسی‌های فعلی را حفظ کن؛ داده و handler نمایشی را وارد محصول نکن. مسیرها و مراحل پیشنهادی را با واقعیت پروژه تطبیق بده. FA/EN/AR، RTL/LTR، تقویم موجود، موبایل، loading/empty/error و دسترس‌پذیری را کامل رعایت کن. تست‌های مرتبط و build را اجرا کن، سرویس‌های لازم را استارت و health-check کن و روشن نگه دار. در پایان تغییرات، نتایج تست و نیازهای حل‌نشده را گزارش بده.</pre><button onclick="copyPrompt()">کپی دستور</button><h3>توکن‌های طراحی</h3>${simpleTable(['کاربرد','مقدار'],Object.entries(spec.tokens))}<h3>کامپوننت‌های پیشنهادی</h3><p dir="ltr">${spec.components.join(' · ')}</p><h3>تطبیق ماژول‌ها و مسیرها</h3><p>به‌جز مسیر سفارش که در تصویر دیده شده، مسیرهای زیر پیشنهادی‌اند. مسیر واقعی پروژه را حفظ کنید.</p>${simpleTable(['مسیر پیشنهادی','نما'],Object.entries(spec.routes))}<h3>قواعد اتصال به سامانه فعلی</h3><ol>${spec.mapping_rules.map(x=>`<li>${escapeHTML(x)}</li>`).join('')}</ol><h3>ترتیب پیاده‌سازی</h3><ol>${spec.implementation_sequence.map(x=>`<li>${escapeHTML(x)}</li>`).join('')}</ol><h3>معیارهای پذیرش</h3><ul>${spec.acceptance.map(x=>`<li>${escapeHTML(x)}</li>`).join('')}</ul><h3>محدودیت‌های نمونه</h3><p>زبان‌ها در این نسخه پوسته را تغییر می‌دهند؛ محتوای نمایشی فرم‌ها فارسی است. شرکت دوم فقط انتخاب نمونه است. بارگذاری طرح به سرور انجام نمی‌شود. پیش‌نویس فقط در حافظه صفحه می‌ماند. نمای حلقه‌ای ۳۶۰ درجه به سفارش آریا اختصاص دارد. تمام این موارد در محصول باید به قابلیت واقعی موجود وصل شوند.</p></section>`}
function showDialog(title,content){dialogOpener=document.activeElement;document.querySelector('#dialogTitle').textContent=title;document.querySelector('#dialogContent').innerHTML=content;document.querySelector('#dialogOverlay').classList.add('open');document.body.style.overflow='hidden';document.querySelector('#dialogOverlay .close').focus()}function closeDialog(){document.querySelector('#dialogOverlay').classList.remove('open');document.body.style.overflow='';dialogOpener?.focus()}function open360(){dialogOpener=document.activeElement;let frame=document.querySelector('#orderFrame');if(!frame.srcdoc)frame.srcdoc=new TextDecoder().decode(Uint8Array.from(atob(demo360),c=>c.charCodeAt(0)));document.querySelector('#orderOverlay').classList.add('open');document.body.style.overflow='hidden';document.querySelector('.outer-close').focus()}function close360(){document.querySelector('#orderOverlay').classList.remove('open');document.body.style.overflow='';dialogOpener?.focus()}window.addEventListener('message',e=>{if(e.source===document.querySelector('#orderFrame').contentWindow&&e.data==='close-order-360')close360()});document.querySelector('#orderFrame').addEventListener('load',()=>{document.querySelector('#orderFrame').contentDocument?.addEventListener('keydown',e=>{if(e.key==='Escape')close360()})});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDialog();close360();toggleNav(false)}let layer=document.querySelector('.overlay.open');if(e.key==='Tab'&&layer){let all=[...layer.querySelectorAll('button,input,select,textarea,iframe,a')].filter(x=>!x.disabled&&x.offsetParent!==null);if(e.shiftKey&&document.activeElement===all[0]){e.preventDefault();all.at(-1).focus()}if(!e.shiftKey&&document.activeElement===all.at(-1)){e.preventDefault();all[0].focus()}}});document.querySelectorAll('.overlay').forEach(e=>e.addEventListener('click',v=>{if(v.target===e)e.id==='orderOverlay'?close360():closeDialog()}));let timer;function toast(s){let e=document.querySelector('#toast');e.textContent=s;e.style.display='block';clearTimeout(timer);timer=setTimeout(()=>e.style.display='none',5000)}function exportOrders(){let lines=['شماره,مشتری,تعداد,مبلغ تومان,وضعیت',...orders.map(o=>[o.id,o.customer,o.qty,o.total,o.status].join(','))];let u=URL.createObjectURL(new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=u;a.download='barang-demo-orders.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function uploadDesign(){showDialog('افزودن طرح نمونه','<label>نام طرح<input placeholder="طرح رویداد"></label><label style="margin-top:16px">انتخاب فایل<input type="file" accept=".svg,.png,.jpg,.pdf"></label><p>انتخاب فایل فقط نمایشی است و به سرور ارسال نمی‌شود.</p><button class="primary" onclick="toast(\'طرح نمونه انتخاب شد؛ تغییری در داده واقعی ایجاد نشد.\');closeDialog()">تأیید نمونه</button>')}async function copyPrompt(){try{await navigator.clipboard.writeText(document.querySelector('#promptText').textContent);toast('دستور کپی شد.')}catch{let s=window.getSelection();s.removeAllRanges();let r=document.createRange();r.selectNodeContents(document.querySelector('#promptText'));s.addRange(r);toast('متن انتخاب شد؛ Ctrl+C را بزنید.')}}document.querySelector('#company').onchange=()=>toast('انتخاب شرکت در این نمونه نمایشی است؛ داده‌ها مشترک‌اند. در محصول، داده هر شرکت باید جداگانه خوانده شود.');nav();render();
</script></body></html>
